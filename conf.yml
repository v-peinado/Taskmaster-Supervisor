programs:

  sleeper:
    cmd: "/bin/sleep 999999"          # CAMBIADO (era 1000000)
    autostart: true
    autorestart: unexpected
    starttime: 2
    stopsignal: TERM
    stoptime: 5
    stdout: ./logs/sleeper.stdout
    stderr: ./logs/sleeper.stderr

  worker:                              # SIN CAMBIOS
    cmd: "/bin/sleep 500"
    numprocs: 2
    autostart: true
    autorestart: unexpected
    starttime: 2
    stdout: ./logs/worker.stdout
    stderr: ./logs/worker.stderr

  newcomer:                            # NUEVO
    cmd: "/bin/sleep 999999"
    autostart: true
    autorestart: unexpected
    starttime: 2
    stdout: ./logs/newcomer.stdout
    stderr: ./logs/newcomer.stderr
